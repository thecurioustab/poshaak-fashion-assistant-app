<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3e6d3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Poshaak">
<meta name="description" content="Poshaak: outfits from the clothes you already own.">
<title>Poshaak</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
:root{
  --milk:#f3e6d3;--deep:#eadbc4;--raised:#fbf5ec;--cocoa:#3a2116;--muted:#7a5442;--line:#d9c3ae;--chai:#8a4a24;
  --lilac:#d6ccf2;--pistachio:#cfe3a8;--apricot:#f4b98e;--white:#fff;
  --sh-sm:3px 3px 0 var(--cocoa);--sh-md:4px 4px 0 var(--cocoa);--sh-lg:6px 6px 0 var(--cocoa);
  --r-sm:14px;--r-md:22px;--r-lg:28px;
  --display:"DM Serif Display",Georgia,serif;--body:"Space Grotesk",system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--milk);color:var(--cocoa);font-family:var(--body);font-size:16px;line-height:1.4}
body{min-height:100dvh;overscroll-behavior-y:none}
button,input{font:inherit;color:inherit}
img{display:block}
a{color:var(--chai)}
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;overflow-x:hidden}
.screen{min-height:100dvh;display:flex;flex-direction:column;gap:18px;padding:calc(var(--safe-t) + 18px) 20px calc(var(--safe-b) + 24px);animation:pk-in .22s ease-out}
.screen.has-nav{padding-bottom:calc(var(--safe-b) + 112px)}
@keyframes pk-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1}
.h-xl{font-size:clamp(38px,11vw,46px);text-transform:uppercase;line-height:.98}
.h-l{font-size:clamp(32px,9.5vw,40px);text-transform:uppercase}
.h-m{font-size:30px}
.h-s{font-size:22px}
.it{font-style:italic;text-transform:none;color:var(--chai)}
.it-plain{font-style:italic}
.muted{color:var(--muted)}
.small{font-size:14px}.xs{font-size:13px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.grow{flex:1}
.center{text-align:center;align-items:center}
.mt-auto{margin-top:auto}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 22px;border-radius:999px;border:2px solid var(--cocoa);background:var(--raised);font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;color:var(--cocoa);transition:transform .12s ease,box-shadow .12s ease,background-color .15s}
.btn.primary{background:var(--pistachio);box-shadow:var(--sh-md);font-size:17px}
.btn.dark{background:var(--cocoa);color:var(--milk)}
.btn.block{width:100%}
.btn.sm{min-height:44px;padding:0 16px;font-size:14px}
.btn:disabled,.btn[aria-disabled=true]{background:var(--deep);border-color:var(--line);color:var(--muted);box-shadow:none;cursor:not-allowed}
.btn img{width:24px;height:24px}
button:active:not(:disabled),a:active,.tap:active{transform:translate(2px,2px)}
.btn.primary:active:not(:disabled){box-shadow:1px 1px 0 var(--cocoa)}
:focus-visible{outline:3px solid var(--chai);outline-offset:2px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:2px solid var(--cocoa);background:var(--raised);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--cocoa);flex-shrink:0;padding:0}
.link{background:none;border:0;padding:0 4px;min-height:44px;font-weight:700;color:var(--chai);cursor:pointer;font-size:15px}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -20px;padding:2px 20px 4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--raised);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;transition:transform .12s,background-color .15s}
.chip.on{background:var(--cocoa);color:var(--milk);border-color:var(--cocoa)}
.chip.dark-line{border-color:var(--cocoa)}
/* cards */
.card{background:var(--raised);border:2px solid var(--cocoa);border-radius:var(--r-md);overflow:hidden}
.card.sticker{box-shadow:var(--sh-md)}
.win-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:2px solid var(--cocoa);background:var(--lilac);font-size:13px;font-weight:500}
.dots{display:flex;gap:6px}.dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--cocoa);display:block}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 12px;border-radius:999px;background:var(--raised);border:1.5px solid var(--cocoa);font-size:12px;font-weight:700}
.badge img{width:18px;height:18px}
.scallop{height:23px;background:radial-gradient(circle at 23px 0,var(--band) 22.5px,transparent 23px) -12px 0/46px 46px repeat-x}
.band{background:var(--band);margin:calc(-1 * (var(--safe-t) + 18px)) -20px 0;padding:calc(var(--safe-t) + 18px) 20px 0}
.kaaj{pointer-events:none;user-select:none}
/* form */
label.lbl{font-size:14px;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.input{width:100%;min-height:50px;border:2px solid var(--line);border-radius:var(--r-sm);padding:0 14px;font-size:16px;background:var(--white);color:var(--cocoa)}
.input:focus{border-color:var(--cocoa);outline:none}
.input.err{border-color:#b3401a}
.err-text{font-size:13px;font-weight:700;color:#9c3615}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--deep);border-radius:999px;padding:4px;gap:4px}
.seg button{min-height:44px;border-radius:999px;border:2px solid transparent;background:transparent;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--raised);border-color:var(--cocoa);color:var(--cocoa)}
.progress{display:flex;gap:6px}.progress i{width:28px;height:6px;border-radius:3px;background:var(--line);display:block}.progress i.on{background:var(--cocoa)}
/* tiles */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tile{position:relative;min-height:124px;padding:14px;border-radius:var(--r-md);border:2px solid var(--line);text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:6px;cursor:pointer;transition:transform .12s,box-shadow .12s}
.tile.on{border:3px solid var(--cocoa);box-shadow:var(--sh-md)}
.tile .t-name{font-family:var(--display);font-size:21px;line-height:1}
.tile img{width:50px;height:50px}
.tick{position:absolute;right:10px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--cocoa);color:var(--milk);display:flex;align-items:center;justify-content:center}
.ph{aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--deep);display:flex;align-items:center;justify-content:center;position:relative}
.ph img.photo{width:100%;height:100%;object-fit:cover}
.ph.b{border:2px solid var(--cocoa)}
.ph .ic{width:46%;height:46%}
.empty-ph{border:2px dashed var(--cocoa);background:transparent;color:var(--cocoa);cursor:pointer}
/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:var(--raised);border-top:2px solid var(--cocoa);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;padding:6px 8px calc(var(--safe-b) + 8px);z-index:20}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:50px;justify-content:center;font-size:12px;font-weight:500;color:var(--muted);text-decoration:none}
.nav a.on{color:var(--cocoa);font-weight:700}
.nav a.fab{margin-top:-30px;color:var(--cocoa);font-weight:700}
.nav .fab span{width:62px;height:62px;border-radius:50%;background:var(--pistachio);border:2px solid var(--cocoa);box-shadow:var(--sh-sm);display:flex;align-items:center;justify-content:center}
.nav .fab img{width:34px;height:34px}
/* misc */
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--safe-t) + 14px);width:calc(100% - 32px);max-width:448px;z-index:50;background:var(--cocoa);color:var(--milk);border-radius:18px;min-height:52px;padding:6px 8px 6px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;font-size:14px;animation:pk-toast .25s ease-out}
.toast a,.toast button{min-height:40px;display:flex;align-items:center;padding:0 14px;border-radius:999px;background:var(--pistachio);color:var(--cocoa);text-decoration:none;border:0;font-weight:700;cursor:pointer}
@keyframes pk-toast{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--cocoa);animation:pk-spin .9s linear infinite;flex-shrink:0}
@keyframes pk-spin{to{transform:rotate(360deg)}}
.pulse{animation:pk-pulse 1.1s ease-in-out infinite}
@keyframes pk-pulse{50%{opacity:.45}}
.sheet-bg{position:fixed;inset:0;background:rgba(58,33,22,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:pk-fade .2s}
@keyframes pk-fade{from{opacity:0}}
.sheet{width:100%;max-width:480px;max-height:92dvh;overflow-y:auto;background:var(--milk);border-top:2px solid var(--cocoa);border-radius:28px 28px 0 0;padding:16px 20px calc(var(--safe-b) + 20px);display:flex;flex-direction:column;gap:14px;animation:pk-up .25s ease-out}
@keyframes pk-up{from{transform:translateY(40px)}}
.grabber{width:44px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.swatch{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.swatch.on{border:3px solid var(--cocoa);box-shadow:0 0 0 3px var(--milk),0 0 0 5px var(--cocoa)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.flatlay{position:relative;height:300px;margin:0 -20px;background:var(--band)}
.flatlay .p{position:absolute;border:2px solid var(--cocoa);overflow:hidden;background:var(--raised);box-shadow:var(--sh-sm)}
.flatlay .p img{width:100%;height:100%;object-fit:cover}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<input type="file" accept="image/*" capture="environment" id="camIn" class="hidden-input" data-change="files" tabindex="-1" aria-hidden="true">
<input type="file" accept="image/*" multiple id="galIn" class="hidden-input" data-change="files" tabindex="-1" aria-hidden="true">
<noscript>Poshaak needs JavaScript turned on.</noscript>
<script src="app.js"></script>
</body>
</html>
